services:
  proxy:
    build:
      context: ./src/proxy
      dockerfile: Dockerfile
    ports:
      - "5557:5557"
      - "5558:5558"

  ref:
    build:
      context: ./src/ref
      dockerfile: Dockerfile
    ports:
      - "5560:5560"

  servidor1:
    build:
      context: ./src/servidor
      dockerfile: Dockerfile
    environment:
      SERVER_NAME: servidor1
      DATA_FILE: /dados/dados.json
      PROXY_PUB_URL: tcp://proxy:5557
      REF_URL: tcp://ref:5560
    volumes:
      - dados_servidor1:/dados
    ports:
      - "5555:5555"
    depends_on:
      - proxy
      - ref

  servidor2:
    build:
      context: ./src/servidor
      dockerfile: Dockerfile
    environment:
      SERVER_NAME: servidor2
      DATA_FILE: /dados/dados.json
      PROXY_PUB_URL: tcp://proxy:5557
      REF_URL: tcp://ref:5560
    volumes:
      - dados_servidor2:/dados
    ports:
      - "5556:5555"
    depends_on:
      - proxy
      - ref

  cliente1:
    build:
      context: ./src/cliente
      dockerfile: Dockerfile
    environment:
      BOT_NAME: ana
      SERVER_URLS: tcp://servidor1:5555,tcp://servidor2:5555
      PROXY_SUB_URL: tcp://proxy:5558
    depends_on:
      - servidor1
      - servidor2
      - proxy

  cliente2:
    build:
      context: ./src/cliente
      dockerfile: Dockerfile
    environment:
      BOT_NAME: bruno
      SERVER_URLS: tcp://servidor1:5555,tcp://servidor2:5555
      PROXY_SUB_URL: tcp://proxy:5558
    depends_on:
      - servidor1
      - servidor2
      - cliente1
      - proxy

volumes:
  dados_servidor1:
  dados_servidor2:
